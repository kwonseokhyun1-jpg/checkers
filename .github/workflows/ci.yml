name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Validate JavaScript
        run: bash scripts/validate-js.sh

      - name: Smoke test
        run: |
          npx playwright install chromium
          python3 -m http.server 8765 --directory dist &
          sleep 2
          node scripts/smoke-test.mjs http://127.0.0.1:8765/index.html
