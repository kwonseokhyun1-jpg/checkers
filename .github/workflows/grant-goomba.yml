name: Grant goomba profile

on:
  workflow_dispatch:

jobs:
  grant:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply goomba profile grant
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/grant-user-goomba.mjs
