<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Arcane Checkers">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#1a2438"/>
      <stop offset="100%" stop-color="#080a12"/>
    </radialGradient>
    <radialGradient id="red" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ff8a8a"/>
      <stop offset="55%" stop-color="#c53030"/>
      <stop offset="100%" stop-color="#742a2a"/>
    </radialGradient>
    <radialGradient id="black" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#718096"/>
      <stop offset="55%" stop-color="#2d3748"/>
      <stop offset="100%" stop-color="#1a202c"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="192" fill="none" stroke="#3d5270" stroke-width="8"/>
  <!-- checker board hint -->
  <g opacity="0.15">
    <rect x="192" y="192" width="128" height="128" fill="#c4a574"/>
    <rect x="320" y="320" width="128" height="128" fill="#c4a574"/>
    <rect x="448" y="448" width="128" height="128" fill="#c4a574"/>
    <rect x="576" y="576" width="128" height="128" fill="#c4a574"/>
    <rect x="704" y="704" width="128" height="128" fill="#c4a574"/>
  </g>
  <circle cx="380" cy="420" r="118" fill="url(#red)" stroke="#ffe566" stroke-width="6"/>
  <circle cx="644" cy="604" r="118" fill="url(#black)" stroke="#5ce1e6" stroke-width="6"/>
  <text x="512" y="560" text-anchor="middle" font-size="120" fill="#e8c547">&</text>
</svg>
